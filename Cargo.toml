[workspace]
members = ["crates/core", "crates/wasm", "crates/ffi", "bindings/python", "bindings/android/rust"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/anshitraj/Universal-Payment-Scanner"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
